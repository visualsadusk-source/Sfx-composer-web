[build]
  publish = "."

[[redirects]]
  from = "/downloads/*"
  to = "/api/download"
  status = 200
  force = true

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"

[[headers]]
  for = "/assets/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
